services:
  m3ucrawler:
    image: ghcr.io/ginjeira/m3ucrawler:latest
    container_name: m3ucrawler
    restart: unless-stopped
    working_dir: /data
    command:
      - --telegram
      - portugal
      - --telegram-maintain
      - --loop-hours
      - "24"
      - --history-hours
      - "24"
      - --max-streams
      - "500"
      - --output-dir
      - /opt/playlists
      - --web
      - --web-port
      - "5000"
      # W-PRE-FIRST-E2E (F-22): activa o botão "Run now" no dashboard.
      # Default do binário é 503 web-allow-trigger-disabled; sem esta
      # flag o trigger manual fica inacessível pela Web UI.
      - --web-allow-trigger
    ports:
      - "5000:5000"
    volumes:
      - /opt/m3ucrawler/runtime-data:/data
      - /opt/m3ucrawler/runtime-data/playlists:/opt/playlists
