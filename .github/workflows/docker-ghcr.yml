name: Docker GHCR Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Evita races em pushes muito próximos: serializa builds e cancela runs anteriores
# do mesmo ref. Runs em refs diferentes (ex.: main e tag v1.0.0) podem correr em
# paralelo. A tag :latest mantém-se coerente com o último push que termina.
concurrency:
  group: docker-ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/m3ucrawler
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/m3ucrawler

jobs:
  # Validação prévia: garante que o código compila e os testes passam antes de
  # gastar tempo a publicar uma imagem. Reutiliza o mesmo toolchain do CI gate.
  validate:
    name: Validate build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore m3uCrawler.sln

      - name: Build (Release)
        run: dotnet build m3uCrawler.sln --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test m3uCrawler.Tests/m3uCrawler.Tests.csproj --configuration Release --no-build --nologo

  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          # Tags publicadas:
          #   - latest           : sempre no default branch
          #   - <branch>         : refs/heads/<branch> (ex.: main)
          #   - <tag>            : refs/tags/v* (ex.: v1.2.3)
          #   - sha-<short>      : imutável por commit
          #   - <sha>            : SHA completo, também imutável
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=m3uCrawler
            org.opencontainers.image.description=m3uCrawler — Telegram/M3U discovery, country validation and stream testing
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./m3uCrawler/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de layers via GHCR (keyed por ref). Reduz tempo de build.
          cache-from: type=gha,scope=${{ github.ref }}
          cache-to: type=gha,scope=${{ github.ref }},mode=max
          # Propaga a metadata de build para o Dockerfile. Estes valores
          # substituem os fallbacks de Directory.Build.props no contexto
          # Docker (que não tem .git/), garantindo coerência entre
          # AssemblyInformationalVersion em runtime e os OCI labels.
          # Fonte canónica única: variáveis do GitHub Actions.
          #
          # M3uCrawlerVersion: usa o nome da tag SemVer (refs/tags/vX.Y.Z)
          # quando disponível; caso contrário (push a branch) usa
          # "0.0.0-dev-<sha>" para que BuildInfo nunca apresente
          # "1.0.0" default do SDK. O Dockerfile faz um strip final do
          # prefixo "v" para converter vX.Y.Z em X.Y.Z (SemVer puro).
          build-args: |
            "M3uCrawlerVersion=${{ github.ref }}"
            "M3uCrawlerCommitSha=${{ github.sha }}"
            "M3uCrawlerBuildNumber=${{ github.run_number }}"
            "M3uCrawlerBuildDate=${{ github.event.repository.updated_at }}"

      - name: Resolve published digest
        id: digest
        # docker/build-push-action não expõe o digest por output nativo.
        # Usamos `docker buildx imagetools inspect` (já autenticado via
        # docker/login-action@v3) para obter o digest do manifest
        # linux/amd64 publicado. Filtra-se a variante de plataforma para
        # obter o digest imutável do manifesto específico que `docker pull`
        # vai usar em produção.
        #
        # Porquê imagetools em vez de curl à API do GHCR:
        # - A autenticação é reutilizada do docker/login-action anterior
        #   (sem expor GITHUB_TOKEN a curl e a logs).
        # - Não depende do scope `packages: read` no GITHUB_TOKEN (que
        #   não está disponível por defeito).
        # - Funciona tanto para manifest single-arch como para OCI index
        #   multi-arch: o jq filtra o entry amd64 no caso multi-arch.
        #
        # Falha de resolução é **não bloqueante**: o push real é o step
        # anterior. Se não conseguirmos o digest, emitimos um `::warning::`
        # e continuamos com `exit 0`, para que workflows idempotentes não
        # fiquem vermelhos por uma falha secundária de observabilidade.
        env:
          IMAGE_BASE: ${{ env.IMAGE_BASE }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          REF="${IMAGE_BASE}:${TAG}"

          # Pedir o manifest em formato JSON bruto. Em multi-arch é o OCI
          # index com .manifests[]; em single-arch é o próprio image
          # manifest (sem .manifests[], com .config e .layers).
          RAW=$(docker buildx imagetools inspect "${REF}" --raw 2>/dev/null || true)

          if [ -z "${RAW}" ]; then
            echo "::warning::Não foi possível resolver o digest publicado para ${REF}; o publish já foi concluído e o workflow continua."
            exit 0
          fi

          # Caminho primário: extrair o digest do manifest linux/amd64
          # (selector .platform.architecture=="amd64" and .platform.os=="linux").
          DIGEST=$(printf '%s' "${RAW}" | jq -r '.manifests[]? | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest' 2>/dev/null | head -n1 || true)

          # Fallback: manifest single-arch. Em single-arch, docker buildx
          # imprime o digest do próprio manifest no formato
          # `<image>@sha256:<64hex>` no header `Name:` quando invocado
          # sem --raw. Re-pedir e extrair.
          if [ -z "${DIGEST:-}" ] || [ "${DIGEST}" = "null" ]; then
            INSPECT=$(docker buildx imagetools inspect "${REF}" 2>/dev/null || true)
            # Encontrar a linha que começa por "Name:" (header da imagem)
            # e extrair o digest @sha256:<64hex> que vem depois.
            DIGEST=$(printf '%s\n' "${INSPECT}" | sed -nE 's/.*@sha256:([a-f0-9]{64}).*/sha256:\1/p' | head -n1 || true)
          fi

          if [ -z "${DIGEST:-}" ]; then
            echo "::warning::Não foi possível extrair o digest de ${REF} via docker buildx imagetools; o publish continua."
            exit 0
          fi

          # Validação defensiva: o digest deve começar por 'sha256:'.
          if ! [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::warning::Digest inválido para ${REF} (esperado sha256:<64hex>): ${DIGEST}; o publish continua."
            exit 0
          fi

          echo "digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "image=${IMAGE_BASE}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Published digest (linux/amd64): ${DIGEST}"

      - name: Summary
        run: |
          {
            echo "## Docker GHCR Publish"
            echo
            echo "- **Image**: \`${{ env.IMAGE_BASE }}\`"
            echo "- **Revision**: \`${{ github.sha }}\`"
            echo "- **Digest (immutable)**: \`${{ steps.digest.outputs.digest }}\`"
            echo "- **Pull by digest**: \`docker pull ${{ env.IMAGE_BASE }}@${{ steps.digest.outputs.digest }}\`"
            echo "- **Pull by commit**: \`docker pull ${{ env.IMAGE_BASE }}:sha-${{ github.sha }}\`"
            echo "- **Pull :latest**: \`docker pull ${{ env.IMAGE_BASE }}:latest\`"
            echo
            echo "Tags published:"
            echo "\`\`\`"
            echo "${{ steps.meta.outputs.tags }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
